name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d1xks, d2s, d2x, d2xks]
        oneui: [6, 7]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio python3

      - name: Cache toolchain
        uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: ~/toolchains/clang-r510928
          key: clang-r510928-v1

      - name: Download toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains/clang-r510928
          cd ~/toolchains/clang-r510928
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r510928.tar.gz
          tar -xf clang-r510928.tar.gz && rm clang-r510928.tar.gz

      - name: Build
        run: |
          chmod +x build_kernel.sh
          ./build_kernel.sh --model ${{ matrix.model }} --oneui ${{ matrix.oneui }} --no-menuconfig

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.model }}-oneui${{ matrix.oneui }}
          path: build/*.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate tag
        id: tag
        run: |
          TAG="r$(date +%Y%m%d%H%M)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=ExtremeKernel ${TAG}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          files: artifacts/*.zip
          body: |
            KernelSU-Next v3.2.0
            Droidspaces: https://github.com/ravindu644/Droidspaces-OSS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
